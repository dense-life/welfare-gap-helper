
name: Weekly welfare API sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 0"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect welfare services
        env:
          WELFARE_API_KEY: ${{ secrets.WELFARE_API_KEY }}
        run: python scripts/fetch_welfare.py

      - name: Validate collected data
        run: python scripts/validate_data.py

      - name: Commit updated data
        run: |
          if git diff --quiet -- data/policies.json; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/policies.json
          git commit -m "Update local government welfare data"
          git push
