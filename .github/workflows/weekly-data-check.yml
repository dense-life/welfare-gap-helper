
name: Weekly welfare API sync

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 0"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Collect local government welfare services
        env:
          WELFARE_API_KEY: ${{ secrets.WELFARE_API_KEY }}
        run: python scripts/fetch_welfare.py

      - name: Validate local government data
        run: python scripts/validate_data.py

      - name: Collect central government welfare services
        env:
          CENTRAL_WELFARE_API_KEY: ${{ secrets.CENTRAL_WELFARE_API_KEY }}
        run: python scripts/fetch_central_welfare.py

      - name: Validate central government data
        run: python scripts/validate_central_data.py

      - name: Commit updated welfare data
        run: |
          if git diff --quiet -- data/policies.json data/central_policies.json; then
            echo "No data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/policies.json data/central_policies.json
          git commit -m "Update welfare service data"
          git push
